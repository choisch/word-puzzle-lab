<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>낱말퍼즐 메이커</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#6b7280;--line:#e4e7ec;--accent:#111827;--soft:#eef0f3;--ok:#eaf7ec;--bad:#fff0f0;--block:#20242b}
    *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}.wrap{max-width:1280px;margin:0 auto;padding:26px 18px 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
    h1{font-size:30px;margin:0 0 6px;letter-spacing:-.045em}.sub{font-size:14px;color:var(--muted)}.modeTabs{display:flex;gap:6px;padding:5px;background:#e9ebef;border-radius:13px;margin-bottom:18px;width:max-content;max-width:100%}
    .modeTab{border:0;background:transparent;border-radius:9px;padding:9px 13px;font-weight:800;color:#606672;cursor:pointer}.modeTab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.035)}
    .settings{padding:18px;position:sticky;top:18px}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none}textarea{min-height:104px;resize:vertical}select:focus,textarea:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
    .rangeRow{display:flex;align-items:center;gap:11px}input[type=range]{width:100%}.badge{min-width:62px;text-align:center;background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.sectionTitle{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.07em;margin:18px 0 9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;display:flex;gap:8px;align-items:center;margin:0}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:7px}
    .actions{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white;flex:1}.ghost{background:var(--soft);color:var(--text)}.dangerText{color:#9b1c1c}.error{display:none;margin-top:12px;padding:10px 12px;background:var(--bad);border-radius:10px;color:#9b1c1c;font-size:12px}.notice{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#f7f7f8;color:#5e6570;font-size:12px}
    .main{padding:20px;min-height:720px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}.bar strong{font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.btns{display:flex;gap:7px;flex-wrap:wrap}.empty{height:520px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
    .crossLayout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}.gridScroll{overflow:auto;padding-bottom:8px}.crossGrid{display:grid;gap:1px;background:#cfd3d9;border:1px solid #cfd3d9;width:max-content;max-width:none}.crossCell{position:relative;width:clamp(29px,4vw,45px);height:clamp(29px,4vw,45px);background:#fff}.crossCell.block{background:var(--block)}.crossCell .num{position:absolute;left:3px;top:2px;font-size:8px;font-weight:800;color:#555;z-index:2}.crossCell input{width:100%;height:100%;border:0;background:transparent;text-align:center;padding:6px 1px 1px;font-weight:850;font-size:clamp(16px,2.2vw,22px);outline:none}.crossCell input:focus{box-shadow:inset 0 0 0 2px #7b8491}.crossCell.correct{background:var(--ok)}.crossCell.wrong{background:var(--bad)}.crossCell.reveal{background:#e9f1ff}.clues h3{font-size:14px;margin:0 0 9px}.clueSection+.clueSection{margin-top:18px}.clueList{display:grid;gap:8px}.clue{font-size:13px;line-height:1.45;display:grid;grid-template-columns:22px 1fr;gap:5px}.clue b{font-size:12px}.clue small{color:var(--muted)}
    .wordSearchLayout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}.wsGrid{display:grid;gap:3px;justify-content:start;user-select:none}.wsCell{display:flex;align-items:center;justify-content:center;border:1px solid #d9dde3;background:#fff;border-radius:5px;font-weight:800;line-height:1;aspect-ratio:1/1;min-width:27px}.wsCell.answer{background:#dff3e3;border-color:#a8d8b1}.words{display:flex;flex-wrap:wrap;gap:7px}.word{background:var(--soft);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:750}
    .status{font-size:12px;font-weight:750;margin-top:9px}.status.ok{color:#177245}.status.bad{color:#a11}.hidden{display:none!important}
    @media(max-width:920px){.layout{grid-template-columns:1fr}.settings{position:static}.crossLayout,.wordSearchLayout{grid-template-columns:1fr}.clues,.wordSide{border-top:1px solid var(--line);padding-top:18px}.top{align-items:flex-start;flex-direction:column}.main{min-height:600px}.crossCell{width:34px;height:34px}}
    @media(max-width:520px){.wrap{padding:18px 10px 36px}.main,.settings{padding:14px}.bar{align-items:flex-start;flex-direction:column}.crossCell{width:31px;height:31px}.crossCell input{font-size:16px}.modeTabs{width:100%}.modeTab{flex:1;padding:9px 8px}.checks{grid-template-columns:1fr}}
    @media print{body{background:#fff}.wrap{max-width:none;padding:0}.settings,.modeTabs,.top .sub,.bar .btns,.notice,.status{display:none!important}.layout{display:block}.card{border:0;box-shadow:none}.main{padding:0}.bar{margin-bottom:14px}.crossLayout{grid-template-columns:1fr 290px}.crossCell{width:32px;height:32px}.crossCell input{font-size:18px}.crossCell.block{background:#222!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wordSearchLayout{grid-template-columns:1fr 220px}.wsCell{border-color:#999;border-radius:0}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>낱말퍼즐 메이커</h1><div class="sub">나이, 관심사, 난이도에 맞춰 가로세로 퀴즈와 숨은 낱말을 자동으로 만듭니다.</div></div></div>
  <div class="modeTabs" role="tablist">
    <button class="modeTab active" data-mode="crossword">가로세로 낱말퀴즈</button>
    <button class="modeTab" data-mode="wordsearch">숨은 낱말 찾기</button>
  </div>
  <div class="layout">
    <aside class="card settings">
      <div class="field"><label for="age">대상 연령</label><select id="age"><option value="5-7">5–7세</option><option value="8-10" selected>8–10세</option><option value="11-13">11–13세</option><option value="14-17">14–17세</option><option value="adult">성인</option></select></div>
      <div class="field"><label for="theme">관심사</label><select id="theme"><option value="animals" selected>동물</option><option value="food">음식</option><option value="nature">자연</option><option value="space">우주</option><option value="sports">스포츠</option><option value="tech">과학·기술</option><option value="mixed">섞어서</option></select></div>
      <div class="field"><label for="difficulty">난이도</label><select id="difficulty"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></div>
      <div class="field"><label for="size">퍼즐 크기</label><div class="rangeRow"><input id="size" type="range" min="8" max="18" value="12"><span id="sizeBadge" class="badge">12 × 12</span></div></div>
      <div class="field"><label for="wordCount">낱말 수</label><div class="rangeRow"><input id="wordCount" type="range" min="5" max="16" value="10"><span id="countBadge" class="badge">10개</span></div></div>
      <div id="wsOptions" class="hidden"><div class="sectionTitle">배치 방식</div><div class="checks"><label class="check"><input id="diagonal" type="checkbox" checked> 대각선</label><label class="check"><input id="reverse" type="checkbox"> 거꾸로</label></div></div>
      <div class="sectionTitle">직접 추가</div>
      <div class="field"><textarea id="custom" placeholder="가로세로: 정답 = 힌트\n예: 공룡 = 아주 오래전에 지구에 살았던 동물\n\n숨은 낱말: 단어만 한 줄씩"></textarea><div class="hint" id="customHint">가로세로 퀴즈에서는 <b>정답 = 힌트</b> 형식으로 입력하세요. 기본 문제은행과 함께 사용됩니다.</div></div>
      <div class="actions"><button id="generate" class="btn primary">새 퍼즐 만들기</button><button id="randomize" class="btn ghost">랜덤</button></div>
      <div id="error" class="error"></div>
    </aside>
    <main class="card main">
      <div class="bar"><div><strong id="title">동물 가로세로 낱말퀴즈</strong><div id="meta" class="meta">8–10세 · 보통 · 12 × 12</div></div><div class="btns"><button id="check" class="btn ghost">채점</button><button id="answer" class="btn ghost">정답 보기</button><button id="print" class="btn ghost">인쇄</button></div></div>
      <div id="content" class="empty"><div><strong>설정을 고르고 퍼즐을 만들어보세요.</strong>AI 없이 문제은행과 배치 알고리즘만으로 생성합니다.</div></div>
    </main>
  </div>
</div>
<script>

const LABELS={animals:"동물",food:"음식",nature:"자연",space:"우주",sports:"스포츠",tech:"과학·기술",mixed:"취향 믹스"};
const AGE={"5-7":{label:"5–7세",maxLevel:1,maxLen:4,base:7},"8-10":{label:"8–10세",maxLevel:2,maxLen:6,base:10},"11-13":{label:"11–13세",maxLevel:3,maxLen:8,base:12},"14-17":{label:"14–17세",maxLevel:4,maxLen:10,base:14},adult:{label:"성인",maxLevel:5,maxLen:12,base:15}};
const FILL=[..."가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호구누두루무부수우주추쿠투푸후기니디리미비시이지치키티피히개내대래매배새애재채캐태패해"];
const $=id=>document.getElementById(id); let mode="crossword",last=null,revealed=false;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function uniqByAnswer(items){const m=new Map();for(const x of items)if(x.answer&&!m.has(x.answer))m.set(x.answer,x);return [...m.values()]}
function parseCustom(){return $("custom").value.split(/\n+/).map(s=>s.trim()).filter(Boolean)}
function getCustomEntries(){return parseCustom().map(line=>{const p=line.split(/\s*[=:：]\s*/);if(p.length<2)return null;const answer=p.shift().replace(/\s+/g,"");const clue=p.join(" ").trim();return answer.length>=2&&clue?{answer,clue,level:1,custom:true}:null}).filter(Boolean)}
function getCustomWords(){return parseCustom().map(s=>s.split(/\s*[=:：]\s*/)[0].replace(/\s+/g,"")).filter(w=>w.length>=2)}
function poolFor(theme){let raw=[];if(theme==="mixed")Object.values(ITEMS).forEach(a=>raw.push(...a));else raw=ITEMS[theme];return raw.map(([answer,clue,level])=>({answer,clue,level}))}
function selectedEntries(){const age=AGE[$("age").value],diff=$("difficulty").value,size=+$('size').value;let levelBoost=diff==="hard"?1:0;let pool=poolFor($("theme").value).filter(x=>x.answer.length<=Math.min(age.maxLen,size)&&x.level<=Math.min(5,age.maxLevel+levelBoost));pool=uniqByAnswer([...getCustomEntries(),...pool]);return pool}
function compatibleScore(word,entries){const chars=new Set([...word]);let score=0;for(const e of entries){if(e.answer===word)continue;for(const ch of new Set([...e.answer]))if(chars.has(ch))score++}return score}
function emptyBoard(n){return Array.from({length:n},()=>Array(n).fill(null))}
function canPlace(board,word,row,col,dir,first=false){const n=board.length,dr=dir==="down"?1:0,dc=dir==="across"?1:0;const er=row+dr*(word.length-1),ec=col+dc*(word.length-1);if(row<0||col<0||er>=n||ec>=n)return null;const br=row-dr,bc=col-dc,ar=er+dr,ac=ec+dc;if(br>=0&&bc>=0&&br<n&&bc<n&&board[br][bc])return null;if(ar>=0&&ac>=0&&ar<n&&ac<n&&board[ar][ac])return null;let crosses=0;for(let i=0;i<word.length;i++){const r=row+dr*i,c=col+dc*i,cell=board[r][c];if(cell&&cell.letter!==word[i])return null;if(cell&&cell.letter===word[i]){crosses++;continue}if(dir==="across"){if((r>0&&board[r-1][c])||(r<n-1&&board[r+1][c]))return null}else{if((c>0&&board[r][c-1])||(c<n-1&&board[r][c+1]))return null}}if(!first&&crosses===0)return null;return crosses}
function place(board,entry,row,col,dir,id){const dr=dir==="down"?1:0,dc=dir==="across"?1:0;for(let i=0;i<entry.answer.length;i++){const r=row+dr*i,c=col+dc*i;if(!board[r][c])board[r][c]={letter:entry.answer[i],owners:[]};board[r][c].owners.push(id)}return {id,entry,row,col,dir}}
function placementsFor(board,entry){const out=[],n=board.length;for(let wi=0;wi<entry.answer.length;wi++){const ch=entry.answer[wi];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(board[r][c]?.letter===ch){for(const dir of ["across","down"]){const row=r-(dir==="down"?wi:0),col=c-(dir==="across"?wi:0),crosses=canPlace(board,entry.answer,row,col,dir,false);if(crosses!==null){const mid=(n-1)/2,centerDist=Math.abs(row+(dir==="down"?(entry.answer.length-1)/2:0)-mid)+Math.abs(col+(dir==="across"?(entry.answer.length-1)/2:0)-mid);out.push({row,col,dir,score:crosses*100-centerDist})}}}}return out}
function buildCrossword(entries,size,wanted){let best=null;const candidates=entries.filter(e=>e.answer.length<=size);for(let attempt=0;attempt<90;attempt++){const board=emptyBoard(size);let list=shuffle(candidates).sort((a,b)=>(compatibleScore(b.answer,candidates)+Math.random()*2)-(compatibleScore(a.answer,candidates)+Math.random()*2));list=list.slice(0,Math.min(list.length,Math.max(wanted+8,18)));if(!list.length)break;const first=list.shift(),dir=attempt%2?"down":"across",row=dir==="across"?Math.floor(size/2):Math.max(0,Math.floor((size-first.answer.length)/2)),col=dir==="down"?Math.floor(size/2):Math.max(0,Math.floor((size-first.answer.length)/2));const words=[];if(canPlace(board,first.answer,row,col,dir,true)!==null)words.push(place(board,first,row,col,dir,"w0"));let changed=true,guard=0;while(changed&&words.length<wanted&&guard++<100){changed=false;let bestChoice=null;for(const entry of list){const ps=placementsFor(board,entry);if(!ps.length)continue;const p=ps.sort((a,b)=>b.score-a.score)[0];const score=p.score+compatibleScore(entry.answer,list)*2+Math.random()*8;if(!bestChoice||score>bestChoice.score)bestChoice={entry,p,score}}if(bestChoice){words.push(place(board,bestChoice.entry,bestChoice.p.row,bestChoice.p.col,bestChoice.p.dir,"w"+words.length));list=list.filter(x=>x!==bestChoice.entry);changed=true}}const intersections=board.flat().filter(c=>c&&c.owners.length>1).length;const quality=words.length*1000+intersections*30;if(!best||quality>best.quality)best={board,words,quality,intersections};if(words.length>=wanted&&intersections>=Math.max(2,Math.floor(wanted/3)))break}if(!best)return null;numberCrossword(best);return best}
function numberCrossword(p){const starts=new Map();for(const w of p.words){const k=w.row+","+w.col;if(!starts.has(k))starts.set(k,[]);starts.get(k).push(w)}const ordered=[...starts.entries()].sort((a,b)=>{const [ar,ac]=a[0].split(',').map(Number),[br,bc]=b[0].split(',').map(Number);return ar-br||ac-bc});let num=1;for(const [,ws] of ordered){ws.forEach(w=>w.number=num);num++}}
function renderCrossword(p){revealed=false;const diff=$("difficulty").value,showLen=diff==="easy";let html=`<div class="crossLayout"><div><div class="gridScroll"><div class="crossGrid" style="grid-template-columns:repeat(${p.board.length},auto)">`;const startNums=new Map(p.words.map(w=>[w.row+","+w.col,w.number]));for(let r=0;r<p.board.length;r++)for(let c=0;c<p.board.length;c++){const cell=p.board[r][c];if(!cell){html+=`<div class="crossCell block"></div>`;continue}const num=startNums.get(r+","+c);html+=`<div class="crossCell" data-r="${r}" data-c="${c}" data-answer="${cell.letter}">${num?`<span class="num">${num}</span>`:""}<input aria-label="${r+1}행 ${c+1}열" maxlength="1" autocomplete="off" autocapitalize="off"></div>`}html+=`</div></div><div id="status" class="status"></div></div><aside class="clues">`;for(const dir of ["across","down"]){const ws=p.words.filter(w=>w.dir===dir).sort((a,b)=>a.number-b.number);html+=`<div class="clueSection"><h3>${dir==="across"?"가로":"세로"}</h3><div class="clueList">`;for(const w of ws)html+=`<div class="clue"><b>${w.number}</b><span>${escapeHtml(w.entry.clue)}${showLen?` <small>(${w.entry.answer.length}글자)</small>`:""}</span></div>`;html+=`</div></div>`}html+=`</aside></div>`;$("content").className="";$("content").innerHTML=html;bindCrossInputs();$("check").classList.remove("hidden")}
function bindCrossInputs(){const inputs=[...document.querySelectorAll('.crossCell input')];inputs.forEach(inp=>{inp.addEventListener('input',()=>{const chars=[...inp.value.trim()];inp.value=chars.length?chars[chars.length-1]:"";inp.closest('.crossCell').classList.remove('correct','wrong');});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value){const i=inputs.indexOf(inp);if(i>0)inputs[i-1].focus()}})})}
function checkCrossword(){if(!last||last.mode!=="crossword")return;let filled=0,correct=0,total=0;document.querySelectorAll('.crossCell[data-answer]').forEach(cell=>{total++;const input=cell.querySelector('input'),v=input.value.trim();cell.classList.remove('correct','wrong');if(v){filled++;if(v===cell.dataset.answer){correct++;cell.classList.add('correct')}else cell.classList.add('wrong')}});const s=$("status");if(filled===total&&correct===total){s.className='status ok';s.textContent='전부 맞았습니다!'}else{s.className='status '+(filled?'bad':'');s.textContent=`${correct}/${total}칸 정답 · ${filled}/${total}칸 입력`}}
function toggleCrossAnswer(){if(!last)return;revealed=!revealed;if(last.mode==="crossword"){document.querySelectorAll('.crossCell[data-answer]').forEach(cell=>{const input=cell.querySelector('input');cell.classList.remove('correct','wrong');if(revealed){input.dataset.prev=input.value;input.value=cell.dataset.answer;cell.classList.add('reveal')}else{input.value=input.dataset.prev||"";cell.classList.remove('reveal')}})}else renderWordSearch(last.puzzle,revealed);$("answer").textContent=revealed?'정답 숨기기':'정답 보기'}
function chooseWsWords(){const age=AGE[$("age").value],size=+$('size').value,count=+$('wordCount').value;let entries=selectedEntries();let words=entries.map(e=>e.answer).concat(getCustomWords());words=[...new Set(words)].filter(w=>w.length>=2&&w.length<=Math.min(age.maxLen,size));return shuffle(words).slice(0,count)}
function buildWordSearch(words,size,diag,rev){const grid=Array.from({length:size},()=>Array(size).fill(null)),placed=[];let dirs=[[0,1],[1,0]];if(diag)dirs.push([1,1],[1,-1]);if(rev)dirs=dirs.concat(dirs.map(([r,c])=>[-r,-c]));for(const word of [...words].sort((a,b)=>b.length-a.length)){let ok=false;for(let t=0;t<220&&!ok;t++){const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)],row=Math.floor(Math.random()*size),col=Math.floor(Math.random()*size),er=row+dr*(word.length-1),ec=col+dc*(word.length-1);if(er<0||ec<0||er>=size||ec>=size)continue;let good=true;for(let i=0;i<word.length;i++){const v=grid[row+dr*i][col+dc*i];if(v&&v!==word[i]){good=false;break}}if(!good)continue;const cells=[];for(let i=0;i<word.length;i++){const r=row+dr*i,c=col+dc*i;grid[r][c]=word[i];cells.push([r,c])}placed.push({word,cells});ok=true}}for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])grid[r][c]=FILL[Math.floor(Math.random()*FILL.length)];return {grid,placed}}
function renderWordSearch(p,show=false){const size=p.grid.length,answers=new Set(show?p.placed.flatMap(x=>x.cells.map(([r,c])=>r+','+c)):[]);let html=`<div class="wordSearchLayout"><div class="gridScroll"><div class="wsGrid" style="grid-template-columns:repeat(${size},minmax(27px,1fr));max-width:${Math.min(720,size*43)}px">`;for(let r=0;r<size;r++)for(let c=0;c<size;c++)html+=`<div class="wsCell ${answers.has(r+','+c)?'answer':''}">${p.grid[r][c]}</div>`;html+=`</div></div><aside class="wordSide"><h3>찾을 낱말</h3><div class="words">${p.placed.map(x=>`<span class="word">${escapeHtml(x.word)}</span>`).join('')}</div><div class="hint">가로, 세로${$('diagonal').checked?', 대각선':''}${$('reverse').checked?', 거꾸로':''} 방향에 숨어 있습니다.</div></aside></div>`;$("content").className="";$("content").innerHTML=html;$("check").classList.add("hidden")}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function generate(){const size=+$('size').value,wanted=+$('wordCount').value;$("error").style.display='none';revealed=false;$("answer").textContent='정답 보기';if(mode==="crossword"){const entries=selectedEntries();if(entries.length<3){showError('조건에 맞는 문제가 너무 적습니다. 연령이나 주제를 바꾸거나 직접 문제를 추가해 주세요.');return}const p=buildCrossword(entries,size,wanted);if(!p||p.words.length<3){showError('교차되는 낱말을 충분히 배치하지 못했습니다. 퍼즐 크기나 낱말 수를 바꿔보세요.');return}last={mode,puzzle:p};renderCrossword(p);if(p.words.length<wanted){const n=document.createElement('div');n.className='notice';n.textContent=`${wanted}개를 요청했지만 서로 교차 가능한 ${p.words.length}개를 배치했습니다. 새 퍼즐 만들기를 누르면 다른 조합을 시도합니다.`;$("content").prepend(n)}}else{const words=chooseWsWords();if(words.length<3){showError('사용할 낱말이 너무 적습니다.');return}const p=buildWordSearch(words,size,$('diagonal').checked,$('reverse').checked);last={mode,puzzle:p};renderWordSearch(p,false)}updateTitle()}
function showError(msg){const e=$("error");e.textContent=msg;e.style.display='block'}
function updateTitle(){const theme=LABELS[$('theme').value],m=mode==='crossword'?'가로세로 낱말퀴즈':'숨은 낱말 찾기';$('title').textContent=`${theme} ${m}`;$('meta').textContent=`${AGE[$('age').value].label} · ${$('difficulty').value==='easy'?'쉬움':$('difficulty').value==='hard'?'어려움':'보통'} · ${$('size').value} × ${$('size').value}`}
function setMode(next){mode=next;document.querySelectorAll('.modeTab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('wsOptions').classList.toggle('hidden',mode!=='wordsearch');$('check').classList.toggle('hidden',mode!=='crossword');$('customHint').innerHTML=mode==='crossword'?'가로세로 퀴즈에서는 <b>정답 = 힌트</b> 형식으로 입력하세요. 기본 문제은행과 함께 사용됩니다.':'한 줄에 낱말 하나씩 입력하세요. <b>정답 = 힌트</b> 형식이어도 정답만 사용합니다.';$('content').className='empty';$('content').innerHTML=`<div><strong>${mode==='crossword'?'가로세로 퀴즈를 만들어보세요.':'숨은 낱말 퍼즐을 만들어보세요.'}</strong>설정을 바꾸고 새 퍼즐 만들기를 누르세요.</div>`;last=null;revealed=false;$('answer').textContent='정답 보기';updateTitle()}
function randomize(){const themes=['animals','food','nature','space','sports','tech','mixed'],diffs=['easy','normal','hard'];$('theme').value=themes[Math.floor(Math.random()*themes.length)];$('difficulty').value=diffs[Math.floor(Math.random()*diffs.length)];$('size').value=8+Math.floor(Math.random()*8);$('wordCount').value=6+Math.floor(Math.random()*8);syncBadges();generate()}
function syncBadges(){$('sizeBadge').textContent=`${$('size').value} × ${$('size').value}`;$('countBadge').textContent=`${$('wordCount').value}개`;updateTitle()}
document.querySelectorAll('.modeTab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('generate').addEventListener('click',generate);$('randomize').addEventListener('click',randomize);$('check').addEventListener('click',checkCrossword);$('answer').addEventListener('click',toggleCrossAnswer);$('print').addEventListener('click',()=>window.print());$('size').addEventListener('input',syncBadges);$('wordCount').addEventListener('input',syncBadges);['age','theme','difficulty'].forEach(id=>$(id).addEventListener('change',()=>{const a=AGE[$('age').value];if(id==='age')$('wordCount').value=Math.min(16,a.base);syncBadges()}));syncBadges();generate();
</script>
