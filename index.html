<title>낱말퍼즐 메이커</title>
<style>

.main{padding:20px;min-height:700px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:17px}.barTitle{font-size:17px;font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.btns{display:flex;gap:7px;flex-wrap:wrap}.empty{height:520px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}.notice{padding:9px 11px;margin-bottom:14px;border-radius:10px;background:#f5f6f8;color:#5d6470;font-size:12px}

</head>
<body>
<div class="wrap">
  <div class="top"><h1>낱말퍼즐 메이커</h1><div class="sub">나이와 관심사에 맞는 문제를 골라 가로세로 낱말퀴즈와 숨은 낱말 퍼즐을 만듭니다.</div></div>
  <div class="tabs"><button class="tab active" data-mode="crossword">가로세로 낱말퀴즈</button><button class="tab" data-mode="wordsearch">숨은 낱말 찾기</button></div>
  <div class="layout">
    <aside class="card settings">
      <div class="field"><label for="age">대상 연령</label><select id="age"><option value="5-7">5–7세</option><option value="8-10" selected>8–10세</option><option value="11-13">11–13세</option><option value="14-17">14–17세</option><option value="adult">성인</option></select></div>
      <div class="field"><label for="theme">관심사</label><select id="theme"><option value="animals" selected>동물</option><option value="food">음식</option><option value="nature">자연</option><option value="space">우주</option><option value="sports">스포츠</option><option value="tech">과학·기술</option><option value="mixed">여러 주제 섞기</option></select></div>
      <div class="field"><label for="difficulty">난이도</label><select id="difficulty"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></div>
      <div class="field"><label for="size">퍼즐 크기</label><div class="rangeRow"><input id="size" type="range" min="8" max="18" value="12"><span id="sizeBadge" class="badge">12 × 12</span></div></div>
      <div class="field"><label for="wordCount">문제 수</label><div class="rangeRow"><input id="wordCount" type="range" min="5" max="18" value="10"><span id="countBadge" class="badge">10개</span></div></div>
      <div id="wsOptions" class="hidden"><div class="sectionTitle">숨은 낱말 배치</div><div class="checks"><label class="check"><input id="diagonal" type="checkbox" checked> 대각선</label><label class="check"><input id="reverse" type="checkbox"> 거꾸로</label></div></div>
      <div class="sectionTitle">직접 추가</div>
      <div class="field"><textarea id="custom" placeholder="가로세로: 정답 = 힌트\n예: 공룡 = 아주 오래전에 지구에 살았던 동물\n\n숨은 낱말: 단어만 한 줄씩"></textarea><div id="customHint" class="helper">가로세로에서는 <b>정답 = 힌트</b> 형식으로 입력하면 기본 문제은행과 함께 사용합니다.</div></div>
      <div class="actions"><button id="generate" class="btn primary">새 퍼즐 만들기</button><button id="randomize" class="btn ghost">랜덤</button></div><div id="error" class="error"></div>
    </aside>
    <main class="card main">
      <div class="bar"><div><div id="title" class="barTitle">동물 가로세로 낱말퀴즈</div><div id="meta" class="meta"></div></div><div class="btns"><button id="check" class="btn ghost">채점</button><button id="answer" class="btn ghost">정답 보기</button><button id="print" class="btn ghost">인쇄</button></div></div>
      <div id="content" class="empty"><div><strong>퍼즐을 만들고 있습니다.</strong></div></div>
    </main>
  </div>
</div>

const FILL=[..."가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호구누두루무부수우주추쿠투푸후기니디리미비시이지치키티피히개내대래매배새애재채캐태패해"];
const $=id=>document.getElementById(id);let mode="crossword",last=null,revealed=false;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function parseLines(){return $("custom").value.split(/\n+/).map(s=>s.trim()).filter(Boolean)}
function customEntries(){return parseLines().map(line=>{const p=line.split(/\s*[=:：]\s*/);if(p.length<2)return null;const answer=p.shift().replace(/\s+/g,"");const clue=p.join(" ").trim();return answer.length>=2&&clue?{answer,clue,level:1,custom:true}:null}).filter(Boolean)}
function customWords(){return parseLines().map(s=>s.split(/\s*[=:：]\s*/)[0].replace(/\s+/g,"")).filter(w=>w.length>=2)}
function rawPool(theme){let rows=[];if(theme==="mixed")Object.values(BANK).forEach(a=>rows.push(...a));else rows=BANK[theme]||[];return rows.map(([answer,clue,level])=>({answer,clue,level}))}
function uniqueEntries(list){const m=new Map();for(const x of list)if(x.answer&&!m.has(x.answer))m.set(x.answer,x);return [...m.values()]}
function entryPool(){const age=AGE[$("age").value],diff=$("difficulty").value,size=+$('size').value;const targetLevel=Math.min(5,age.level+(diff==="hard"?1:diff==="easy"?-1:0));let pool=rawPool($("theme").value).filter(x=>x.answer.length<=Math.min(age.maxLen,size)&&x.level<=Math.max(1,targetLevel));if(pool.length<+$('wordCount').value*2){pool=rawPool($("theme").value).filter(x=>x.answer.length<=Math.min(age.maxLen+2,size)&&x.level<=Math.min(5,targetLevel+1))}return uniqueEntries([...customEntries(),...pool])}
function emptyBoard(n){return Array.from({length:n},()=>Array(n).fill(null))}
function shareCount(a,b){const A=new Set([...a]),B=new Set([...b]);let n=0;for(const c of A)if(B.has(c))n++;return n}
function connectivity(entry,pool){let s=0;for(const x of pool)if(x!==entry)s+=shareCount(entry.answer,x.answer);return s}
function canPlace(board,entry,row,col,dir,mustCross){const word=entry.answer,n=board.length,dr=dir==="down"?1:0,dc=dir==="across"?1:0;const er=row+dr*(word.length-1),ec=col+dc*(word.length-1);if(row<0||col<0||er<0||ec<0||er>=n||ec>=n)return null;const br=row-dr,bc=col-dc,ar=er+dr,ac=ec+dc;if(br>=0&&bc>=0&&br<n&&bc<n&&board[br][bc])return null;if(ar>=0&&ac>=0&&ar<n&&ac<n&&board[ar][ac])return null;let crosses=0;for(let i=0;i<word.length;i++){const r=row+dr*i,c=col+dc*i,cell=board[r][c];if(cell){if(cell.letter!==word[i]||cell.dirs.has(dir))return null;crosses++;continue}if(dir==="across"){if((r>0&&board[r-1][c])||(r<n-1&&board[r+1][c]))return null}else{if((c>0&&board[r][c-1])||(c<n-1&&board[r][c+1]))return null}}if(mustCross&&crosses===0)return null;return crosses}
function doPlace(board,entry,row,col,dir,id){const dr=dir==="down"?1:0,dc=dir==="across"?1:0;for(let i=0;i<entry.answer.length;i++){const r=row+dr*i,c=col+dc*i;if(!board[r][c])board[r][c]={letter:entry.answer[i],dirs:new Set(),owners:[]};board[r][c].dirs.add(dir);board[r][c].owners.push(id)}return{id,entry,row,col,dir}}
function crossingPositions(board,entry){const out=[],n=board.length,mid=(n-1)/2;for(let wi=0;wi<entry.answer.length;wi++){const ch=entry.answer[wi];for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(board[r][c]?.letter!==ch)continue;for(const dir of ["across","down"]){const row=r-(dir==="down"?wi:0),col=c-(dir==="across"?wi:0),cross=canPlace(board,entry,row,col,dir,true);if(cross===null)continue;const wr=row+(dir==="down"?(entry.answer.length-1)/2:0),wc=col+(dir==="across"?(entry.answer.length-1)/2:0);const dist=Math.abs(wr-mid)+Math.abs(wc-mid);out.push({row,col,dir,cross,score:cross*120-dist*2})}}}return out}
function freePositions(board,entry){const out=[],n=board.length,mid=(n-1)/2;for(const dir of ["across","down"]){for(let r=0;r<n;r++)for(let c=0;c<n;c++){const cross=canPlace(board,entry,r,c,dir,false);if(cross!==0)continue;const wr=r+(dir==="down"?(entry.answer.length-1)/2:0),wc=c+(dir==="across"?(entry.answer.length-1)/2:0);const dist=Math.abs(wr-mid)+Math.abs(wc-mid);out.push({row:r,col:c,dir,cross:0,score:-dist})}}return out}
function bounds(board){let minR=999,minC=999,maxR=-1,maxC=-1;for(let r=0;r<board.length;r++)for(let c=0;c<board.length;c++)if(board[r][c]){minR=Math.min(minR,r);minC=Math.min(minC,c);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c)}return maxR<0?null:{minR,minC,maxR,maxC,area:(maxR-minR+1)*(maxC-minC+1)}}
function buildCrossword(entries,size,wanted){let best=null;const usable=entries.filter(e=>e.answer.length<=size);if(!usable.length)return null;for(let attempt=0;attempt<180;attempt++){const board=emptyBoard(size);const words=[];let remaining=shuffle(usable);remaining.sort((a,b)=>(connectivity(b,usable)+Math.random()*4)-(connectivity(a,usable)+Math.random()*4));const first=remaining.shift(),firstDir=attempt%2?"down":"across";const fr=firstDir==="across"?Math.floor(size/2):Math.max(0,Math.floor((size-first.answer.length)/2)),fc=firstDir==="down"?Math.floor(size/2):Math.max(0,Math.floor((size-first.answer.length)/2));words.push(doPlace(board,first,fr,fc,firstDir,"w0"));let stalled=0;while(words.length<wanted&&remaining.length&&stalled<8){let choice=null;for(const entry of remaining){const ps=crossingPositions(board,entry);if(!ps.length)continue;ps.sort((a,b)=>b.score-a.score);const p=ps[0],score=p.score+connectivity(entry,remaining)*3+Math.random()*12;if(!choice||score>choice.score)choice={entry,p,score,crossed:true}}if(!choice){stalled++;const candidates=remaining.map(entry=>{const ps=freePositions(board,entry);if(!ps.length)return null;ps.sort((a,b)=>b.score-a.score);return{entry,p:ps[0],score:ps[0].score+Math.random()*3,crossed:false}}).filter(Boolean).sort((a,b)=>b.score-a.score);choice=candidates[0]||null}if(!choice)break;words.push(doPlace(board,choice.entry,choice.p.row,choice.p.col,choice.p.dir,"w"+words.length));remaining=remaining.filter(x=>x!==choice.entry)}const intersections=board.flat().filter(c=>c&&c.owners.length>1).length,b=bounds(board),placed=words.length,area=b?b.area:size*size;const quality=placed*10000+intersections*250-area*3;if(!best||quality>best.quality)best={board,words,intersections,quality,bounds:b};if(placed>=wanted&&intersections>=Math.max(2,Math.floor(wanted*.45)))break}if(!best)return null;numberWords(best);return cropPuzzle(best)}
function numberWords(p){const starts=new Map();for(const w of p.words){const k=w.row+","+w.col;if(!starts.has(k))starts.set(k,[]);starts.get(k).push(w)}const ordered=[...starts.entries()].sort((a,b)=>{const A=a[0].split(',').map(Number),B=b[0].split(',').map(Number);return A[0]-B[0]||A[1]-B[1]});let n=1;for(const[,ws]of ordered){ws.forEach(w=>w.number=n);n++}}
function cropPuzzle(p){const b=p.bounds||bounds(p.board);if(!b)return p;const pad=1,minR=Math.max(0,b.minR-pad),minC=Math.max(0,b.minC-pad),maxR=Math.min(p.board.length-1,b.maxR+pad),maxC=Math.min(p.board.length-1,b.maxC+pad);const board=[];for(let r=minR;r<=maxR;r++)board.push(p.board[r].slice(minC,maxC+1));const words=p.words.map(w=>({...w,row:w.row-minR,col:w.col-minC}));return{...p,board,words,bounds:{minR:0,minC:0,maxR:board.length-1,maxC:board[0].length-1,area:board.length*board[0].length}}}
function renderCrossword(p){revealed=false;const showLen=$("difficulty").value==="easy";let html=`<div class="stats"><span class="stat">${p.words.length}문제</span><span class="stat">${p.intersections}개 교차</span><span class="stat">문제은행 ${entryPool().length}개</span></div><div class="crossLayout"><div><div class="gridScroll"><div class="crossGrid" style="grid-template-columns:repeat(${p.board[0].length},auto)">`;const starts=new Map(p.words.map(w=>[w.row+","+w.col,w.number]));for(let r=0;r<p.board.length;r++)for(let c=0;c<p.board[r].length;c++){const cell=p.board[r][c];if(!cell){html+=`<div class="crossCell block"></div>`;continue}const num=starts.get(r+","+c);html+=`<div class="crossCell" data-answer="${cell.letter}">${num?`<span class="num">${num}</span>`:""}<input maxlength="1" autocomplete="off" autocapitalize="off" aria-label="낱말 칸"></div>`}html+=`</div></div><div id="status" class="status"></div></div><aside class="clues">`;for(const dir of ["across","down"]){const ws=p.words.filter(w=>w.dir===dir).sort((a,b)=>a.number-b.number);html+=`<section class="clueSection"><h3>${dir==="across"?"가로":"세로"}</h3><div class="clueList">`;for(const w of ws)html+=`<div class="clue"><b>${w.number}</b><span>${escapeHtml(w.entry.clue)}${showLen?` <small>(${w.entry.answer.length}글자)</small>`:""}</span></div>`;html+=`</div></section>`}html+=`</aside></div>`;$("content").className="";$("content").innerHTML=html;bindInputs();$("check").classList.remove("hidden")}
function bindInputs(){const inputs=[...document.querySelectorAll('.crossCell input')];for(const input of inputs){input.addEventListener('input',()=>{const chars=[...input.value.trim()];input.value=chars.at(-1)||"";input.closest('.crossCell').classList.remove('correct','wrong')});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value){const i=inputs.indexOf(input);if(i>0)inputs[i-1].focus()}})}}
function checkCrossword(){if(!last||last.mode!=="crossword")return;let total=0,filled=0,correct=0;document.querySelectorAll('.crossCell[data-answer]').forEach(cell=>{total++;const input=cell.querySelector('input'),v=input.value.trim();cell.classList.remove('correct','wrong');if(v){filled++;if(v===cell.dataset.answer){correct++;cell.classList.add('correct')}else cell.classList.add('wrong')}});const s=$("status");if(correct===total&&filled===total){s.className='status ok';s.textContent='전부 맞았습니다!'}else{s.className='status '+(filled?'bad':'');s.textContent=`${correct}/${total}칸 정답 · ${filled}/${total}칸 입력`}}
function toggleAnswer(){if(!last)return;revealed=!revealed;if(last.mode==="crossword"){document.querySelectorAll('.crossCell[data-answer]').forEach(cell=>{const input=cell.querySelector('input');cell.classList.remove('correct','wrong');if(revealed){input.dataset.prev=input.value;input.value=cell.dataset.answer;cell.classList.add('reveal')}else{input.value=input.dataset.prev||"";cell.classList.remove('reveal')}})}else renderWordSearch(last.puzzle,revealed);$("answer").textContent=revealed?'정답 숨기기':'정답 보기'}
function wsWords(){const age=AGE[$("age").value],size=+$('size').value,count=+$('wordCount').value;let words=entryPool().map(e=>e.answer).concat(customWords());words=[...new Set(words)].filter(w=>w.length>=2&&w.length<=Math.min(size,age.maxLen+2));return shuffle(words).slice(0,count)}
function buildWordSearch(words,size,diag,rev){const grid=Array.from({length:size},()=>Array(size).fill(null)),placed=[];let dirs=[[0,1],[1,0]];if(diag)dirs.push([1,1],[1,-1]);if(rev)dirs=dirs.concat(dirs.map(([r,c])=>[-r,-c]));for(const word of [...words].sort((a,b)=>b.length-a.length)){let ok=false;for(let t=0;t<260&&!ok;t++){const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)],r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size),er=r+dr*(word.length-1),ec=c+dc*(word.length-1);if(er<0||ec<0||er>=size||ec>=size)continue;let good=true;for(let i=0;i<word.length;i++){const v=grid[r+dr*i][c+dc*i];if(v&&v!==word[i]){good=false;break}}if(!good)continue;const cells=[];for(let i=0;i<word.length;i++){const rr=r+dr*i,cc=c+dc*i;grid[rr][cc]=word[i];cells.push([rr,cc])}placed.push({word,cells});ok=true}}for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])grid[r][c]=FILL[Math.floor(Math.random()*FILL.length)];return{grid,placed}}
function renderWordSearch(p,show){const answerCells=new Set(show?p.placed.flatMap(x=>x.cells.map(([r,c])=>r+','+c)):[]),size=p.grid.length;let html=`<div class="stats"><span class="stat">${p.placed.length}개 낱말</span><span class="stat">문제은행 ${entryPool().length}개</span></div><div class="wsLayout"><div class="gridScroll"><div class="wsGrid" style="grid-template-columns:repeat(${size},minmax(27px,1fr));max-width:${Math.min(740,size*44)}px">`;for(let r=0;r<size;r++)for(let c=0;c<size;c++)html+=`<div class="wsCell ${answerCells.has(r+','+c)?'answer':''}">${p.grid[r][c]}</div>`;html+=`</div></div><aside class="wordSide"><h3>찾을 낱말</h3><div class="words">${p.placed.map(x=>`<span class="word">${escapeHtml(x.word)}</span>`).join('')}</div><div class="helper">가로, 세로${$('diagonal').checked?', 대각선':''}${$('reverse').checked?', 거꾸로':''} 방향을 확인해 보세요.</div></aside></div>`;$("content").className="";$("content").innerHTML=html;$("check").classList.add("hidden")}
function showError(msg){const e=$("error");e.textContent=msg;e.style.display='block'}
function generate(){const size=+$('size').value,wanted=+$('wordCount').value;$("error").style.display='none';revealed=false;$("answer").textContent='정답 보기';if(mode==="crossword"){const pool=entryPool();if(pool.length<5){showError('이 조건에서 사용할 문제가 부족합니다. 연령이나 난이도를 바꿔 주세요.');return}const p=buildCrossword(pool,size,wanted);if(!p||p.words.length<Math.min(5,wanted)){showError('이번 조합은 배치가 어려웠습니다. 새 퍼즐 만들기를 한 번 더 눌러 주세요.');return}last={mode,puzzle:p};renderCrossword(p);if(p.words.length<wanted){const n=document.createElement('div');n.className='notice';n.textContent=`요청한 ${wanted}개 중 ${p.words.length}개를 배치했습니다. 현재 설정에서 교차와 간격 조건을 만족하는 최대 조합입니다.`;$("content").prepend(n)}}else{const words=wsWords(),p=buildWordSearch(words,size,$('diagonal').checked,$('reverse').checked);last={mode,puzzle:p};renderWordSearch(p,false)}updateHeader()}
function updateHeader(){const theme=LABELS[$('theme').value],kind=mode==='crossword'?'가로세로 낱말퀴즈':'숨은 낱말 찾기',d=$('difficulty').value==='easy'?'쉬움':$('difficulty').value==='hard'?'어려움':'보통';$('title').textContent=`${theme} ${kind}`;$('meta').textContent=`${AGE[$('age').value].label} · ${d} · ${$('size').value} × ${$('size').value}`}
function setMode(next){mode=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('wsOptions').classList.toggle('hidden',mode!=='wordsearch');$('check').classList.toggle('hidden',mode!=='crossword');$('customHint').innerHTML=mode==='crossword'?'가로세로에서는 <b>정답 = 힌트</b> 형식으로 입력하면 기본 문제은행과 함께 사용합니다.':'한 줄에 낱말 하나씩 입력하세요. <b>정답 = 힌트</b>로 써도 정답만 사용합니다.';last=null;generate()}
function sync(){ $('sizeBadge').textContent=`${$('size').value} × ${$('size').value}`;$('countBadge').textContent=`${$('wordCount').value}개`;updateHeader()}
function randomize(){const themes=['animals','food','nature','space','sports','tech','mixed'],diffs=['easy','normal','hard'];$('theme').value=themes[Math.floor(Math.random()*themes.length)];$('difficulty').value=diffs[Math.floor(Math.random()*diffs.length)];$('size').value=9+Math.floor(Math.random()*7);$('wordCount').value=7+Math.floor(Math.random()*8);sync();generate()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('generate').addEventListener('click',generate);$('randomize').addEventListener('click',randomize);$('check').addEventListener('click',checkCrossword);$('answer').addEventListener('click',toggleAnswer);$('print').addEventListener('click',()=>window.print());$('size').addEventListener('input',sync);$('wordCount').addEventListener('input',sync);['age','theme','difficulty'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='age')$('wordCount').value=Math.min(18,AGE[$('age').value].base);sync()}));sync();generate();
</script>
