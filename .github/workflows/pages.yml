name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply app assets
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ.get('BUILD_SHA', 'latest')[:12]

          cache_meta = '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">'
          if 'http-equiv="Cache-Control"' not in s:
              s = s.replace('<meta name="viewport" content="width=device-width,initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1">\n' + cache_meta)

          assets = [
              ('css', './prototype-theme.css'),
              ('css', './field-layout.css'),
              ('css', './wordsearch-interaction.css'),
              ('css', './portal-sudoku.css'),
              ('css', './sudoku-notes.css'),
              ('css', './sudoku-rules.css'),
              ('css', './sudoku-timer.css'),
              ('css', './sudoku-assist.css'),
              ('css', './minesweeper.css'),
              ('css', './minesweeper-records.css'),
              ('css', './number-baseball.css'),
              ('js', './wordsearch-interaction.js'),
              ('js', './wordsearch-hint.js'),
              ('js', './portal-sudoku.js'),
              ('js', './sudoku-notes.js'),
              ('js', './sudoku-rules.js'),
              ('js', './sudoku-timer.js'),
              ('js', './sudoku-assist.js'),
              ('js', './sudoku-autofill.js'),
              ('js', './minesweeper.js'),
              ('js', './minesweeper-records.js'),
              ('js', './number-baseball.js'),
          ]

          for kind, path in assets:
              escaped = re.escape(path)
              if kind == 'css':
                  s = re.sub(r'\s*<link rel="stylesheet" href="' + escaped + r'(?:\?v=[^"]+)?">', '', s)
              else:
                  s = re.sub(r'\s*<script src="' + escaped + r'(?:\?v=[^"]+)?"></script>', '', s)

          links = [
              f'<link rel="stylesheet" href="./prototype-theme.css?v={version}">',
              f'<link rel="stylesheet" href="./field-layout.css?v={version}">',
              f'<link rel="stylesheet" href="./wordsearch-interaction.css?v={version}">',
              f'<link rel="stylesheet" href="./portal-sudoku.css?v={version}">',
              f'<link rel="stylesheet" href="./sudoku-notes.css?v={version}">',
              f'<link rel="stylesheet" href="./sudoku-rules.css?v={version}">',
              f'<link rel="stylesheet" href="./sudoku-timer.css?v={version}">',
              f'<link rel="stylesheet" href="./sudoku-assist.css?v={version}">',
              f'<link rel="stylesheet" href="./minesweeper.css?v={version}">',
              f'<link rel="stylesheet" href="./minesweeper-records.css?v={version}">',
              f'<link rel="stylesheet" href="./number-baseball.css?v={version}">',
          ]
          s = s.replace('</head>', '\n'.join(links) + '\n</head>')

          scripts = [
              f'<script src="./wordsearch-interaction.js?v={version}"></script>',
              f'<script src="./wordsearch-hint.js?v={version}"></script>',
              f'<script src="./portal-sudoku.js?v={version}"></script>',
              f'<script src="./sudoku-notes.js?v={version}"></script>',
              f'<script src="./sudoku-rules.js?v={version}"></script>',
              f'<script src="./sudoku-timer.js?v={version}"></script>',
              f'<script src="./sudoku-assist.js?v={version}"></script>',
              f'<script src="./sudoku-autofill.js?v={version}"></script>',
              f'<script src="./minesweeper.js?v={version}"></script>',
              f'<script src="./minesweeper-records.js?v={version}"></script>',
              f'<script src="./number-baseball.js?v={version}"></script>',
          ]
          s = s.replace('</body>', '\n'.join(scripts) + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
